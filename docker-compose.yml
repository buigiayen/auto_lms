services:
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    image: lotuslms-client:local
    restart: unless-stopped
    environment:
      PORT: 3100
      CLIENT_HOST: client
      CLIENT_LISTEN_HOST: 0.0.0.0
      CLIENT_DATA_DIR: /app/data
      CLIENT_USERNAME: "${CLIENT_USERNAME:?Set CLIENT_USERNAME in .env}"
      CLIENT_PASSWORD: "${CLIENT_PASSWORD:?Set CLIENT_PASSWORD in .env}"
      CLIENT_SESSION_SECURE: "${CLIENT_SESSION_SECURE:-false}"
      WORKER_REGISTRATION_KEY: "${WORKER_REGISTRATION_KEY:?Set WORKER_REGISTRATION_KEY in .env}"
    ports:
      - "127.0.0.1:${CLIENT_PORT:-3100}:3100"
    volumes:
      - lotuslms-client-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker-v2
    image: lotuslms-worker-v2:local
    restart: unless-stopped
    depends_on:
      client:
        condition: service_healthy
    environment:
      Client__BaseUrl: http://client:3100
      Client__RequestTimeoutSeconds: ${CLIENT_REQUEST_TIMEOUT_SECONDS:-10}
      Worker__WorkerName: ${WORKER_NAME:-worker-v2}
      Worker__MaxConcurrentAccounts: ${MAX_CONCURRENT_ACCOUNTS:-5}
      Worker__RegistrationApiKey: "${WORKER_REGISTRATION_KEY:?Set WORKER_REGISTRATION_KEY in .env}"
      Worker__PollIntervalSeconds: ${POLL_INTERVAL_SECONDS:-5}
      Worker__HeartbeatIntervalSeconds: ${HEARTBEAT_INTERVAL_SECONDS:-5}
      Worker__StopOnDailyKpi: ${STOP_ON_DAILY_KPI:-false}
      Worker__IncludePractice: ${INCLUDE_PRACTICE:-false}

volumes:
  lotuslms-client-data:
